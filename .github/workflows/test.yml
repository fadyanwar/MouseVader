name: tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Unit and system tests
        run: npm test
      - name: End-to-end (Firefox)
        run: |
          export GECKODRIVER="$GECKOWEBDRIVER/geckodriver"
          npm run test:e2e
      - name: Build package
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: mousevader-xpi
          path: dist/*.xpi
