<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MouseVader</title>
  <link rel="stylesheet" href="ui.css">
  <style>body { width: 320px; padding: 14px 16px; }</style>
</head>
<body>
  <div class="brand">
    <img src="../icons/darth-64.png" alt="">
    <div>
      <h1>MouseVader</h1>
      <div class="muted" style="font-size:12px">Fake pointer activity that pollutes tracking data</div>
    </div>
  </div>

  <div class="status" id="status" role="status" aria-live="polite">
    <strong id="state" data-state="">…</strong>
    <div class="muted" id="detail"></div>
  </div>

  <div class="row">
    <label for="enabled">MouseVader on<span class="sub">All sites. Shortcut: Alt+Shift+M</span></label>
    <span class="switch"><input type="checkbox" id="enabled" role="switch"><span></span></span>
  </div>
  <div class="row">
    <label for="site">Run on this site<span class="sub" id="siteName">—</span></label>
    <span class="switch"><input type="checkbox" id="site" role="switch"><span></span></span>
  </div>
  <div class="row">
    <span id="speedLabel">Speed</span>
    <div class="seg" role="group" aria-labelledby="speedLabel" id="speed">
      <button type="button" data-speed="slow" aria-pressed="false">Slow</button>
      <button type="button" data-speed="normal" aria-pressed="false">Normal</button>
      <button type="button" data-speed="fast" aria-pressed="false">Fast</button>
    </div>
  </div>
  <div style="margin-top:10px; display:flex; justify-content:space-between">
    <button type="button" class="link" id="options">All settings and excluded sites</button>
  </div>

  <script src="core.js"></script>
  <script src="popup.js"></script>
</body>
</html>
